[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oa-auxseg-vlm"
version = "0.1.0"
description = "Optical-anchored arbitrary-auxiliary landslide segmentation and mask-grounded VLM research."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16,<4",
    "numpy>=2.1,<3",
    "scipy>=1.16,<2",
    "torch>=2.8,<3",
    "torchvision>=0.23,<0.24",
]

[project.scripts]
oa-auxseg = "oa_groundrag.phase2.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oa_groundrag*", "scripts.phase1_benchmark_build*"]
namespaces = true
