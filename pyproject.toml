[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oa-auxseg-vlm"
version = "0.1.0"
description = "Optical-anchored arbitrary-auxiliary landslide segmentation and mask-grounded VLM research."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16,<4",
    "numpy>=2.1,<3",
    "Pillow>=11,<12",
    "PyYAML>=6,<7",
    "scipy>=1.16,<2",
    "torch>=2.8,<3",
    "torchvision>=0.23,<0.24",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
phase4 = [
    "accelerate>=1.10,<2",
    "peft>=0.15,<1",
    "qwen-vl-utils>=0.0.14,<1",
    "safetensors>=0.6,<1",
    "transformers>=5.3,<6",
]
stage6 = [
    "PyMuPDF>=1.26,<2",
    "rapidocr>=3,<4",
    "onnxruntime>=1.22,<2",
]

[project.scripts]
oa-auxseg = "oa_groundrag.phase2.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "oa_groundrag*",
    "scripts.phase1_benchmark_build*",
    "scripts.phase3_rs_generaldesc*",
    "scripts.phase4_rs_vlm*",
    "scripts.stage6_text_rag*",
]
namespaces = true
