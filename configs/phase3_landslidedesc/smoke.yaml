schema_version: oa_landslidedesc.build_config.v3
profile: smoke
seed: 20260727
output_root: /tmp/oa_landslidedesc_smoke_v3
sources:
  rsgpt:
    enabled: true
    root: ../../../datasets/describe_datasets/RSGPT/dataset
  mmrs1m:
    enabled: true
    root: ../../../datasets/describe_datasets/MMRS-1M
  disasterm3:
    enabled: true
    root: ../../../datasets/describe_datasets/DisasterM3
oa:
  enabled: true
  benchmark_root: ../../../benchmark/oa_auxseg_hdf5_v1/small
  selection_root: ../../../benchmark/oa_auxseg_hdf5_v1/small
  gold_annotations: null
  silver_annotations: null
  expected_gold_count: 358
external_split:
  version: external_parent_split.v1
  validation_percent: 5
text_policy:
  version: visible_claims.v1
  forbidden_patterns:
    - '\b(?:risk|danger|hazard level|stability|unstable|active landslide)\b'
    - '\b(?:caused by|causal|probably|likely|potential(?:ly)?|might have|may have)\b'
  reasoning_forbidden_patterns:
    - '\b(?:season|summer|winter|spring|autumn)\b'
    - '\b(?:used for|fish farming|in motion|moving fast|moving slow)\b'
    - '\b(?:north|south|east|west)(?:\s*[-–]\s*|\s+to\s+)(?:north|south|east|west)\b'
asset_policy:
  image_format: jpeg
  image_quality: 95
  jpeg_subsampling: 0
  target_size: null
  mask_format: png
  oa_preview_clip: [-3.0, 3.0]
sharding:
  records_per_shard: 16
workers: 1
limits:
  max_parents: 32
  max_records: 40
  max_assets: 64
  max_copied_bytes: 268435456
  max_validation_candidates_per_task: 512
  per_task:
    'rsgpt:global_caption:RSICap': 1
    'rsgpt:global_caption:RSIEval': 1
    'rsgpt:visual_qa:presence': 1
    'rsgpt:object_count:quantity': 1
    'rsgpt:visual_qa:ab_position': 1
    'rsgpt:scene_understanding:scene': 1
    'rsgpt:visual_qa:reasoning': 1
    'mmrs1m:global_caption': 1
    'mmrs1m:visual_qa': 2
    'mmrs1m:bbox_region_caption': 1
    'disasterm3:scene_understanding:Disaster Bearing Bodies Recognition': 1
    'disasterm3:scene_understanding:Disaster Scene Recognition': 1
    'disasterm3:object_count:Building Damage Counting': 1
    'disasterm3:object_count:Road Damage Counting': 1
    'disasterm3:spatial_relation:relational reasoning': 1
    'disasterm3:visible_change_report:disaster caption': 1
    'oa:oa_mask_facts:empty': 1
    'oa:oa_mask_facts:positive': 1
deletion_allowlist: false
